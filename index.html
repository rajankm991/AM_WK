<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-text: #ffffff;
    --nav-hover: rgba(255, 255, 255, 0.25);

    --hdr-grad: linear-gradient(135deg, #003A8C 0%, #0066CC 60%, #0052CC 100%);
    --hdr-solid: #0052CC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Flexbox viewport layout */
  html, body { 
    width: 100%;
    height: 100vh;
    font-family: 'Golos Text', 'Inter', sans-serif; 
    overflow: hidden;
    background: #f4f6f8;
    display: flex;
    flex-direction: column;
  }

  /* Compact Sticky Navbar */
  header.navbar {
    height: 45px;
    background: var(--hdr-grad);
    padding: 0 0.75rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-shadow: 0 2px 12px rgba(0, 60, 140, 0.3);
    z-index: 1000;
    flex-shrink: 0;
    gap: 0.75rem;
  }

  /* Hamburger that collapses/expands the side nav */
  .nav-toggle {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .nav-toggle:hover {
    background: var(--nav-hover);
  }
  .nav-toggle span {
    display: block;
    width: 15px;
    height: 2px;
    border-radius: 2px;
    background: var(--nav-text);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
  }
  .brand-logo-wrapper {
    background: #ffffff;
    padding: 0.2rem 0.5rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-logo-img {
    height: 16px;
    width: auto;
    display: block;
  }
  .brand-tag {
    font-size: 0.65rem;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 0.15rem 0.45rem;
    border-radius: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }


  .hdr-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .clk {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    font-family: Consolas, 'SFMono-Regular', ui-monospace, monospace;
    font-variant-numeric: tabular-nums; /* stops the width jumping every tick */
    white-space: nowrap;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: var(--nav-text);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .user-chip:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  .user-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .user-chip .chev {
    width: 11px;
    height: 11px;
    opacity: 0.7;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.15s ease;
  }
  .user-chip.menu-open .chev {
    transform: rotate(180deg);
  }
  .user-chip-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .user-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 170px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 40, 0.25);
    padding: 6px;
    display: none;
    z-index: 1100;
  }
  .user-menu.open {
    display: block;
  }
  .user-menu-label {
    font-size: 10px;
    color: #667085;
    padding: 6px 8px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-menu-divider {
    height: 1px;
    background: #eaecf0;
    margin: 4px 0;
  }
  .user-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border: none;
    background: transparent;
    color: #b42318;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    text-decoration: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .user-menu-item:hover {
    background: #fef3f2;
  }
  .user-menu-item svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Row that holds the side nav + the tool frames */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* Vertical side nav. */
  .sidebar {
    width: 175px;
    flex-shrink: 0;
    background: var(--hdr-solid);
    padding: 6px;
    overflow: hidden;
    transition: width 0.22s ease, padding 0.22s ease, box-shadow 0.22s ease;
  }

  /* Collapsed: */
  body.nav-collapsed .sidebar {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 15px;
    padding: 6px 0;
    z-index: 900;
  }
  body.nav-collapsed .frame-stack {
    margin-left: 14px;
  }

  /* Hover the rail to peek the full nav */
  body.nav-collapsed .sidebar:hover {
    width: 175px;
    padding: 6px;
    box-shadow: 2px 0 10px rgba(0, 0, 72, 0.28);
  }

  /* Scrollable Navigation Container with lighter background */
  .nav-tabs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    height: 100%;
    align-items: stretch;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(255, 255, 255, 0.12); /* Adjusted to a lighter highlight color */
    padding: 6px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
  }

  /* Custom Scrollbar Styling */
  .nav-tabs::-webkit-scrollbar {
    width: 3px;
  }
  .nav-tabs::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.5);
    border-radius: 3px;
  }
  .nav-tabs::-webkit-scrollbar-track {
    background: transparent;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
    padding: 0.4rem 0.6rem;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.2s, border-color 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
    width: 100%;
    text-align: left;
  }
  .tab-btn:hover {
    background: var(--nav-hover);
  }
  /* Matches  */
  .tab-btn.active {
    background: #ffffff;
    border-color: #ffffff;
    color: var(--hdr-solid);
  }

  /* Full Fill Seamless Iframe */
  .frame-stack {
    flex: 1;
    min-width: 0;
    position: relative;
    min-height: 0;
    background: #f4f6f8;
  }
  .content-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }
  .content-frame.active {
    display: block;
  }

  /* On narrow screens the nav floats over the tool even when pinned open,
     instead of squeezing it down to nothing */
  @media (max-width: 700px) {
    body:not(.nav-collapsed) .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 900;
      box-shadow: 2px 0 8px rgba(0, 0, 72, 0.25);
    }
  }

  /* Drop the clock before the brand and the chip start colliding */
  @media (max-width: 520px) {
    .clk { display: none; }
  }

  /* Micro Footer */
  footer {
    background: var(--hdr-solid);
    color: rgba(255, 255, 255, 0.7);
    padding: 1px 1rem;
    font-size: 0.6rem;
    line-height: 12px;
    text-align: center;
    width: 100%;
    height: 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header class="navbar">
  <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation"
          aria-controls="sidebar" aria-expanded="true" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
  <div class="brand">
    <div class="brand-logo-wrapper">
      <img src="https://careers.cognizant.com/images/logo.svg" alt="Cognizant Logo" class="brand-logo-img">
    </div>
    <div class="brand-tag">AM Workspace</div>
  </div>

  <div class="hdr-right">
    <span class="clk" id="clkEl"></span>

    <div class="user-chip-wrap">
      <div class="user-chip" id="userChip" title="Signed-in user" onclick="toggleUserMenu(event)">
        <div class="user-avatar" id="userAvatar">&ndash;</div>
        <span id="userChipName">FMS-AM</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="user-menu" id="userMenu">
        <div class="user-menu-label" id="userMenuLabel"></div>
        <div class="user-menu-divider"></div>
        <a class="user-menu-item" id="signOutLink" href="signed_out.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Sign Out
        </a>
      </div>
    </div>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar" id="sidebar">
    <nav class="nav-tabs">
      <!-- data-key must be unique per tool -->
     <button class="tab-btn active" data-key="home" onclick="switchTab(this)">Home</button>
	 <button class="tab-btn" data-key="pivot" data-url="pivot.html" onclick="switchTab(this)">Pivot Table Tool</button>
     <button class="tab-btn" data-key="text_compare" data-url="text_compare.html"  onclick="switchTab(this)">Text Compare Tool</button>
     <button class="tab-btn" data-key="am_activity_tracker" data-url="am_activity_tracker.html" onclick="switchTab(this)">Tracker Tool</button>
	<button class="tab-btn" data-key="html_apex" data-url="html_apex.html" onclick="switchTab(this)">HTML Converter</button>
	<button class="tab-btn" data-key="Trial" data-url="2" onclick="switchTab(this)">Trial</button>
    </nav>
  </aside>

  <!-- Left empty on purpose: switchTab creates each tool's iframe on first use. -->
  <div class="frame-stack" id="frameStack"></div>

</div>

<footer>&copy; Cognizant 2026, all rights reserved.(RKM)</footer>

<script>

  const underConstructionHTML = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body {
          font-family: 'Golos Text', 'Inter', sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 70vh;
          margin: 0;
          color: #000048;
          text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.85rem; }
        .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
      </style>
    </head>
    <body>
      <div class="icon">🚧</div>
      <h1>Coming Soon...</h1>
      <p>This page is currently under construction.</p>
    </body>
    </html>
  `;

  // ── USER MENU (dropdown with Sign Out) ──
  function toggleUserMenu(e) {
    if (e) e.stopPropagation();
    const chip = document.getElementById('userChip');
    const menu = document.getElementById('userMenu');
    const isOpen = menu.classList.contains('open');
    if (isOpen) {
      menu.classList.remove('open');
      chip.classList.remove('menu-open');
    } else {
      menu.classList.add('open');
      chip.classList.add('menu-open');
    }
  }

  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.user-chip-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('userMenu').classList.remove('open');
      document.getElementById('userChip').classList.remove('menu-open');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.getElementById('userMenu').classList.remove('open');
      document.getElementById('userChip').classList.remove('menu-open');
    }
  });

  // ── LIVE CLOCK ──
  // Same locale/format as the tracker's own clock, so they read identically.
  function updateClock() {
    document.getElementById('clkEl').textContent =
      new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);


  // Collapse / expand the vertical side nav.
  function toggleNav() {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    document.getElementById('navToggle')
            .setAttribute('aria-expanded', String(!collapsed));
  }


  // ── CURRENT USER (single source of truth) ──
  // Avatar initial, header chip, menu label, and the Home panel greeting
  // all read from this. Call setCurrentUser('NEW NAME') at runtime (e.g.
  // after login/SSO resolves) and every one of those spots updates together.
  function setCurrentUser(name) {
    const trimmed = (name || '').trim();
    const initial = trimmed ? trimmed.charAt(0).toUpperCase() : '\u2013';

    const avatarEl = document.getElementById('userAvatar');
    const chipNameEl = document.getElementById('userChipName');
    const menuLabelEl = document.getElementById('userMenuLabel');
    const homeNameEl = document.getElementById('homeUserName');

    if (avatarEl) avatarEl.textContent = initial;
    if (chipNameEl) chipNameEl.textContent = trimmed;
    if (menuLabelEl) menuLabelEl.textContent = trimmed;
    if (homeNameEl) homeNameEl.textContent = trimmed;
  }

  // Initialize from whatever is currently in the chip markup, so the
  // very first render (before any runtime change) still stays consistent.
  setCurrentUser(document.getElementById('userChipName').textContent);


  // Home is rendered inline (not an iframe) so it never nests a copy of this
  // same page inside itself.
  const homeHTML = `
    <div id="amws-home" style="font-family:'Golos Text','Inter',sans-serif; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:transparent; position:relative; overflow:hidden;">
<div style="position:absolute; top:50%; left:50%; width:220%; height:220%; transform:translate(-50%,-50%) rotate(-30deg); background-image:url('https://careers.cognizant.com/images/logo.svg'); background-repeat:repeat; background-size:320px 200px; background-position:0 0; opacity:0.07; pointer-events:none;"></div>
      <div style="position:relative; z-index:1; background:#ffffff; border-radius:16px; padding:40px 36px; max-width:380px; width:90%; text-align:center; box-shadow:0 20px 50px rgba(0,0,40,0.3);">
        <div style="width:56px; height:56px; margin:0 auto 18px; border-radius:50%; background:#e7f0ff; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:28px; height:28px; fill:none; stroke:#0052CC; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg>
        </div>
        <h1 style="font-size:1.25rem; color:#001d4a; margin-bottom:8px;">Welcome to AM Workspace</h1>
        <p style="font-size:0.85rem; color:#667085; line-height:1.5; margin-bottom:0;">You're signed in as <strong id="homeUserName"></strong>.<br>Choose a tool from the left-hand navigation to get started.</p>
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:26px; opacity:0.7;">
          <img src="https://careers.cognizant.com/images/logo.svg" alt="Cognizant" style="height:14px;">
          <span style="font-size:0.65rem; color:#98a2b3; letter-spacing:0.03em; text-transform:uppercase;">AM Workspace</span>
        </div>
      </div>
    </div>
  `;

  function showHome() {
    let home = document.getElementById('frame-home-panel');
    if (!home) {
      home = document.createElement('div');
      home.id = 'frame-home-panel';
      home.className = 'content-frame';
      home.innerHTML = homeHTML;
      document.getElementById('frameStack').appendChild(home);
    }
    home.classList.add('active');
    // Re-sync in case setCurrentUser() was called while Home wasn't mounted yet.
    setCurrentUser(document.getElementById('userChipName').textContent);
  }

  // Show the "Coming Soon" frame for tools whose page isn't there.
  function showPlaceholder() {
    let placeholder = document.getElementById('frame-placeholder');
    if (!placeholder) {
      placeholder = document.createElement('iframe');
      placeholder.id = 'frame-placeholder';
      placeholder.className = 'content-frame';
      placeholder.srcdoc = underConstructionHTML;
      document.getElementById('frameStack').appendChild(placeholder);
    }
    placeholder.classList.add('active');
  }


  function fileExists(url, cb) {
    const link = document.createElement('link');
    let settled = false;
    const finish = ok => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      link.remove();
      cb(ok);
    };

    const timer = setTimeout(() => finish(true), 1500);
    link.rel = 'prefetch';
    link.href = url;
    link.onload = () => finish(true);
    link.onerror = () => finish(false);
    document.head.appendChild(link);
  }

  function getFrame(key) {
    let frame = document.getElementById('frame-' + key);
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'frame-' + key;
      frame.className = 'content-frame';
      frame.dataset.key = key;
      document.getElementById('frameStack').appendChild(frame);
    }
    return frame;
  }

  function switchTab(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const key = btn.getAttribute('data-key');
    const url = btn.getAttribute('data-url');

    document.querySelectorAll('.content-frame').forEach(f => f.classList.remove('active'));

    if (key === 'home') { showHome(); return; }

    const target = key ? getFrame(key) : null;

    if (!url || !target || btn.dataset.missing === '1') { showPlaceholder(); return; }

    if (target.src) { target.classList.add('active'); return; }

    fileExists(url, ok => {
 
      if (!btn.classList.contains('active')) return;
      if (ok) {
        target.src = url;
        target.classList.add('active');
      } else {
        btn.dataset.missing = '1';
        showPlaceholder();
      }
    });
  }


  const initialTab = document.querySelector('.tab-btn.active') || document.querySelector('.tab-btn');
  if (initialTab) switchTab(initialTab);
</script>

</body>
</html>
