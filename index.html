<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AM Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-text: #ffffff;
    --nav-hover: rgba(255, 255, 255, 0.25);

    --hdr-grad: linear-gradient(135deg, #003A8C 0%, #0066CC 60%, #0052CC 100%);
    --hdr-solid: #0052CC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Flexbox viewport layout */
  html, body { 
    width: 100%;
    height: 100vh;
    font-family: 'Golos Text', 'Inter', sans-serif; 
    overflow: hidden;
    background: #f4f6f8;
    display: flex;
    flex-direction: column;
  }

  /* Compact Sticky Navbar */
  header.navbar {
    height: 45px;
    background: var(--hdr-grad);
    padding: 0 0.75rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-shadow: 0 2px 12px rgba(0, 60, 140, 0.3);
    z-index: 1000;
    flex-shrink: 0;
    gap: 0.75rem;
  }

  /* Hamburger that collapses/expands the side nav */
  .nav-toggle {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .nav-toggle:hover {
    background: var(--nav-hover);
  }
  .nav-toggle span {
    display: block;
    width: 15px;
    height: 2px;
    border-radius: 2px;
    background: var(--nav-text);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
  }
  .brand-logo-wrapper {
    background: #ffffff;
    padding: 0.2rem 0.5rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-logo-img {
    height: 16px;
    width: auto;
    display: block;
  }
  .brand-tag {
    font-size: 0.65rem;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 0.15rem 0.45rem;
    border-radius: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }


  .hdr-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .clk {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
    font-family: Consolas, 'SFMono-Regular', ui-monospace, monospace;
    font-variant-numeric: tabular-nums; /* stops the width jumping every tick */
    white-space: nowrap;
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: var(--nav-text);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0.55;
  }
  .user-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .user-chip .chev {
    width: 11px;
    height: 11px;
    opacity: 0.7;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Row that holds the side nav + the tool frames */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* Vertical side nav. */
  .sidebar {
    width: 175px;
    flex-shrink: 0;
    background: var(--hdr-solid);
    padding: 6px;
    overflow: hidden;
    transition: width 0.22s ease, padding 0.22s ease, box-shadow 0.22s ease;
  }

  /* Collapsed: */
  body.nav-collapsed .sidebar {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 15px;
    padding: 6px 0;
    z-index: 900;
  }
  body.nav-collapsed .frame-stack {
    margin-left: 14px;
  }

  /* Hover the rail to peek the full nav */
  body.nav-collapsed .sidebar:hover {
    width: 175px;
    padding: 6px;
    box-shadow: 2px 0 10px rgba(0, 0, 72, 0.28);
  }

  /* Scrollable Navigation Container with lighter background */
  .nav-tabs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    height: 100%;
    align-items: stretch;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(255, 255, 255, 0.12); /* Adjusted to a lighter highlight color */
    padding: 6px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
  }

  /* Custom Scrollbar Styling */
  .nav-tabs::-webkit-scrollbar {
    width: 3px;
  }
  .nav-tabs::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.5);
    border-radius: 3px;
  }
  .nav-tabs::-webkit-scrollbar-track {
    background: transparent;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #ffffff;
    padding: 0.4rem 0.6rem;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.2s, border-color 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
    width: 100%;
    text-align: left;
  }
  .tab-btn:hover {
    background: var(--nav-hover);
  }
  /* Matches  */
  .tab-btn.active {
    background: #ffffff;
    border-color: #ffffff;
    color: var(--hdr-solid);
  }

  /* Full Fill Seamless Iframe */
  .frame-stack {
    flex: 1;
    min-width: 0;
    position: relative;
    min-height: 0;
    background: #f4f6f8;
  }
  .content-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }
  .content-frame.active {
    display: block;
  }

  /* On narrow screens the nav floats over the tool even when pinned open,
     instead of squeezing it down to nothing */
  @media (max-width: 700px) {
    body:not(.nav-collapsed) .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      z-index: 900;
      box-shadow: 2px 0 8px rgba(0, 0, 72, 0.25);
    }
  }

  /* Drop the clock before the brand and the chip start colliding */
  @media (max-width: 520px) {
    .clk { display: none; }
  }

  /* Micro Footer */
  footer {
    background: var(--hdr-solid);
    color: rgba(255, 255, 255, 0.7);
    padding: 1px 1rem;
    font-size: 0.6rem;
    line-height: 12px;
    text-align: center;
    width: 100%;
    height: 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body class="nav-collapsed">

<header class="navbar">
  <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation"
          aria-controls="sidebar" aria-expanded="false" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
  <div class="brand">
    <div class="brand-logo-wrapper">
      <img src="https://careers.cognizant.com/images/logo.svg" alt="Cognizant Logo" class="brand-logo-img">
    </div>
    <div class="brand-tag">AM Workspace</div>
  </div>

  <div class="hdr-right">
    <span class="clk" id="clkEl"></span>

    <div class="user-chip" title="Signed-in user">
      <div class="user-avatar">&ndash;</div>
      <span>CTS</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</header>

<div class="workspace">

  <aside class="sidebar" id="sidebar">
    <nav class="nav-tabs">
      <!-- data-key must be unique per tool -->
     <button class="tab-btn active" data-key="pivot" data-url="pivot.html" onclick="switchTab(this)">Pivot Table Tool</button>
     <button class="tab-btn" data-key="text_compare" data-url="text_compare.html"  onclick="switchTab(this)">Text Compare Tool</button>
     <button class="tab-btn" data-key="am_activity_tracker" data-url="am_activity_tracker.html" onclick="switchTab(this)">Tracker Tool</button>
	<button class="tab-btn" data-key="Trial" data-url="2" onclick="switchTab(this)">Trial</button>
  
    </nav>
  </aside>

  <!-- Left empty on purpose: switchTab creates each tool's iframe on first use. -->
  <div class="frame-stack" id="frameStack"></div>

</div>

<footer>&copy; Cognizant 2026, all rights reserved.(RKM)</footer>

<script>

  const underConstructionHTML = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body {
          font-family: 'Golos Text', 'Inter', sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 70vh;
          margin: 0;
          color: #000048;
          text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.85rem; }
        .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
      </style>
    </head>
    <body>
      <div class="icon">🚧</div>
      <h1>Coming Soon...</h1>
      <p>This page is currently under construction.</p>
    </body>
    </html>
  `;

  // ── LIVE CLOCK ──
  // Same locale/format as the tracker's own clock, so they read identically.
  function updateClock() {
    document.getElementById('clkEl').textContent =
      new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);


  // Collapse / expand the vertical side nav.
  function toggleNav() {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    document.getElementById('navToggle')
            .setAttribute('aria-expanded', String(!collapsed));
  }


  // Show the "Coming Soon" frame for tools whose page isn't there.
  function showPlaceholder() {
    let placeholder = document.getElementById('frame-placeholder');
    if (!placeholder) {
      placeholder = document.createElement('iframe');
      placeholder.id = 'frame-placeholder';
      placeholder.className = 'content-frame';
      placeholder.srcdoc = underConstructionHTML;
      document.getElementById('frameStack').appendChild(placeholder);
    }
    placeholder.classList.add('active');
  }


  function fileExists(url, cb) {
    const link = document.createElement('link');
    let settled = false;
    const finish = ok => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      link.remove();
      cb(ok);
    };

    const timer = setTimeout(() => finish(true), 1500);
    link.rel = 'prefetch';
    link.href = url;
    link.onload = () => finish(true);
    link.onerror = () => finish(false);
    document.head.appendChild(link);
  }

  function getFrame(key) {
    let frame = document.getElementById('frame-' + key);
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'frame-' + key;
      frame.className = 'content-frame';
      frame.dataset.key = key;
      document.getElementById('frameStack').appendChild(frame);
    }
    return frame;
  }

  function switchTab(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const key = btn.getAttribute('data-key');
    const url = btn.getAttribute('data-url');

    document.querySelectorAll('.content-frame').forEach(f => f.classList.remove('active'));

    const target = key ? getFrame(key) : null;

    if (!url || !target || btn.dataset.missing === '1') { showPlaceholder(); return; }

    if (target.src) { target.classList.add('active'); return; }

    fileExists(url, ok => {
 
      if (!btn.classList.contains('active')) return;
      if (ok) {
        target.src = url;
        target.classList.add('active');
      } else {
        btn.dataset.missing = '1';
        showPlaceholder();
      }
    });
  }


  const initialTab = document.querySelector('.tab-btn.active') || document.querySelector('.tab-btn');
  if (initialTab) switchTab(initialTab);
</script>

</body>
</html>
