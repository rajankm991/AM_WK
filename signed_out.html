<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signed Out - AM Workspace</title>
<style>
  #amws-signedout, #amws-signedout * { box-sizing: border-box; margin: 0; padding: 0; }
  #amws-signedout {
    font-family: 'Golos Text', 'Inter', sans-serif;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #003A8C 0%, #0066CC 60%, #0052CC 100%);
  }
  #amws-signedout .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 40, 0.3);
  }
  #amws-signedout .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #e7f6ec;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #amws-signedout .icon svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: #12b76a;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #amws-signedout h1 {
    font-size: 1.25rem;
    color: #001d4a;
    margin-bottom: 8px;
  }
  #amws-signedout p {
    font-size: 0.85rem;
    color: #667085;
    line-height: 1.5;
    margin-bottom: 26px;
  }
  #amws-signedout .btn {
    display: inline-block;
    background: #0052CC;
    color: #ffffff;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px 28px;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.2s;
  }
  #amws-signedout .btn:hover {
    background: #003A8C;
  }
  #amws-signedout .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 26px;
    opacity: 0.7;
  }
  #amws-signedout .brand-row img {
    height: 14px;
  }
  #amws-signedout .brand-row span {
    font-size: 0.65rem;
    color: #98a2b3;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="amws-signedout">
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>You've been signed out</h1>
    <p>Thanks for using AM Workspace. Your session has ended securely.<br>Please log in again to continue.</p>
    <a class="btn" href="index.html">Log In Again</a>
    <div class="brand-row">
      <img src="https://careers.cognizant.com/images/logo.svg" alt="Cognizant">
      <span>AM Workspace</span>
    </div>
  </div>
</div>
</body>
</html>
